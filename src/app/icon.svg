<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0614"/>
      <stop offset="50%" stop-color="#0B051D"/>
      <stop offset="100%" stop-color="#15092A"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="limeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Lime Gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3fc51"/>
      <stop offset="100%" stop-color="#a8f013"/>
    </linearGradient>

    <!-- Purple Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>

  <!-- Rounded Obsidian Card Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ambient Circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#7e22ce" stroke-width="2" opacity="0.25"/>

  <!-- Orbit Ring 1 (Purple Vertical-ish) -->
  <ellipse cx="256" cy="256" rx="90" ry="190" fill="none" stroke="url(#purpleGrad)" stroke-width="12" filter="url(#purpleGlow)" transform="rotate(-25 256 256)"/>
  <circle cx="170" cy="100" r="14" fill="#e3fc51" filter="url(#limeGlow)"/>

  <!-- Orbit Ring 2 (Lime Horizontal-ish) -->
  <ellipse cx="256" cy="256" rx="190" ry="90" fill="none" stroke="url(#limeGrad)" stroke-width="12" filter="url(#limeGlow)" transform="rotate(-25 256 256)"/>
  <circle cx="410" cy="180" r="14" fill="#a855f7" filter="url(#purpleGlow)"/>

  <!-- Orbit Ring 3 (Diagonal) -->
  <ellipse cx="256" cy="256" rx="190" ry="90" fill="none" stroke="#9333ea" stroke-width="8" opacity="0.7" transform="rotate(35 256 256)"/>
  <circle cx="110" cy="340" r="12" fill="#e3fc51" filter="url(#limeGlow)"/>

  <!-- Central LC Monogram -->
  <g transform="translate(145, 170)" filter="url(#limeGlow)">
    <!-- L shape -->
    <path d="M 10 10 L 10 150 L 90 150" fill="none" stroke="#a855f7" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- C shape -->
    <path d="M 210 40 C 160 10 110 50 110 90 C 110 130 160 170 210 140" fill="none" stroke="url(#limeGrad)" stroke-width="28" stroke-linecap="round"/>
  </g>
</svg>
